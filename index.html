<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="calc.css">
        <script src="calc.js" defer></script>
    </head>
    <body>
        <div class="calc">
            <input class="screen" type="text" readonly>
            <div class="keys">
                <div class="numbers">
                    <div>
                        <button class="num-keys backspace">&#x232B;</button>
                        <button class="num-keys clear">Clear</button>
                        <button class="display num-keys modulo">%</button>
                    </div>
                    <div>
                        <button class="display num-keys seven">7</button>
                        <button class="display num-keys eight">8</button>
                        <button class="display num-keys nine">9</button>
                    </div>
                    <div>
                        <button class="display num-keys four">4</button>
                        <button class="display num-keys five">5</button>
                        <button class="display num-keys six">6</button>
                    </div>
                    <div>
                        <button class="display num-keys one">1</button>
                        <button class="display num-keys two">2</button>
                        <button class="display num-keys three">3</button>
                    </div>
                    <div>
                        <button class="num-keys negative-sign">+/-</button>
                        <button class="display num-keys zero">0</button>
                        <button class="display num-keys decimal">.</button>
                    </div>
                </div>
                <div class="operations">
                    <button class="display operation-key divide">&divide;</button>
                    <button class="display operation-key multiply">*</button>
                    <button class="display operation-key subtract">-</button>
                    <button class="display operation-key add">+</button>
                    <button class="operation-key equals">=</button>
                </div>
            </div>
        </div>
    </body>
</html>
